services:
  postgres:
    container_name: evolution_postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_senha_forte
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass redis_senha_forte
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolution_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_senha_forte", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  promogamer-api:
    container_name: promogamer_api
    build: ./
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
        - SERVER_PORT=8080
    networks:
      - evolution_network
    depends_on:
      - evolution-api

volumes:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:

networks:
  evolution_network:
    driver: bridge